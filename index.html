<body>

  <!-- SCREEN 1: HOME -->
  <div id="screen-home">
    <header class="home-header">
      <h1>EPSO AD5 Practice</h1>
      <p class="subtitle">Select a test to begin</p>
    </header>

    <main class="home-main">
      <section class="test-list" id="test-list">
        <!-- Test cards injected by JS -->
      </section>

      <section class="timer-setup" id="timer-setup" style="display:none;">
        <h2>Timer settings</h2>
        <div class="timer-controls">
          <label class="timer-toggle">
            <input type="checkbox" id="timer-enabled" checked>
            <span>Enable timer</span>
          </label>
          <div class="timer-input-row" id="timer-input-row">
            <label for="timer-minutes">Duration (minutes):</label>
            <input type="number" id="timer-minutes" value="35" min="1" max="240">
          </div>
        </div>
        <button class="btn-primary" id="btn-start">Start test</button>
      </section>
    </main>
  </div>

  <!-- SCREEN 2: TEST -->
  <div id="screen-test" class="hidden">
    <div class="test-topbar" id="test-topbar">
      <div class="topbar-left">
        <span class="test-title-bar" id="test-title-bar"></span>
        <span class="unanswered-badge" id="unanswered-badge"></span>
      </div>
      <div class="topbar-right">
        <span class="timer-display" id="timer-display"></span>
        <button class="btn-submit" id="btn-submit">Submit</button>
      </div>
    </div>

    <div class="test-body" id="test-body">
      <!-- Questions injected by JS -->
    </div>
  </div>

  <!-- SCREEN 3: RESULTS -->
  <div id="screen-results" class="hidden">
    <div class="results-container">
      <h1 class="results-title">Results</h1>

      <div class="score-card" id="score-card">
        <!-- Score injected by JS -->
      </div>

      <div class="review-section" id="review-section">
        <!-- Wrong questions injected by JS -->
      </div>

      <button class="btn-primary btn-home" id="btn-home">Back to home</button>
    </div>
  </div>

  <!-- Confirm dialog -->
  <div id="overlay" class="overlay hidden">
    <div class="dialog">
      <p id="dialog-message"></p>
      <div class="dialog-buttons">
        <button class="btn-secondary" id="dialog-cancel">Cancel</button>
        <button class="btn-primary" id="dialog-confirm">Submit anyway</button>
      </div>
    </div>
  </div>
